<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../JMG/hv.jpg" type="image/x-icon">
    <link rel="stylesheet" href="../BOOTSTRAP/css/bootstrap.min.css">
    <script src="../BOOTSTRAP/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Thanh toán</title>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }
        .form-control {
            border-radius: 5px;
        }
        .btn-primary {
            border-radius: 5px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #007bff;
        }
        .product-details {
            background-color: #f1f3f5;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .product-details p {
            margin-bottom: 10px;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #6c757d;
        }
    </style>
</head>
<body>
  <div class="container mt-5">
    <h2>Thanh toán</h2>
    <div class="product-details">
      <p><strong>Tên sản phẩm:</strong> <span id="ten-sp"></span></p>
      <p><strong>Giá:</strong> <span id="gia-sp"></span> VNĐ</p>
    </div>
    <form id="payment-form">
      <div class="mb-3">
        <label for="ten">Họ và tên</label>
        <input type="text" class="form-control" id="ten" required>
      </div>
      <div class="mb-3">
        <label for="sdt">Số điện thoại</label>
        <input type="tel" class="form-control" id="sdt" required pattern="[0-9]{10,11}">
      </div>
      <div class="mb-3">
        <label for="diachi">Địa chỉ</label>
        <textarea class="form-control" id="diachi" rows="3" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary w-100">Xác nhận thanh toán</button>
    </form>
    <div class="footer">
        <p>&copy; DEV <sub>2005</sub> | Tất cả quyền được bảo lưu</p>
    </div>
  </div>

  <script>
    window.onload = function () {
      const product = JSON.parse(localStorage.getItem('product'));
      if (product) {
        document.getElementById('ten-sp').textContent = product.name;
        document.getElementById('gia-sp').textContent = product.price.toLocaleString();
      } else {
        alert("Không có sản phẩm để thanh toán.");
        window.location.href = "Home.html"; 
      }
    };

    document.getElementById('payment-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const name = document.getElementById('ten').value;
      const phone = document.getElementById('sdt').value;
      const address = document.getElementById('diachi').value;

      if (name && phone && address) {
        alert("Thanh toán thành công!");
        localStorage.removeItem('product'); 
        window.location.href = "Home.html";
      } else {
        alert("Vui lòng điền đầy đủ thông tin!");
      }
    });
  </script>
</body>
</html>
